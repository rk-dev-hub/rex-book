name: CI

on:
  push:
    branches: [main]
  pull_request:

# E2E（Playwright）は RexCarte の API・DB・Mailpit が必要なため、ここでは実行しない。
# 型チェック・lint・単体テスト・ビルドを確認する。
jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      - run: npm run build
